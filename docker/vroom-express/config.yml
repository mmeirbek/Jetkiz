cliArgs:
  geometry: false # retrieve geometry (-g)
  planmode: false # run vroom in plan mode (-c) if set to true
  threads: 4 # number of threads to use (-t)
  explore: 5 # exploration level to use (0..5) (-x)
  limit: '1mb' # max request size
  logdir: '/app/logs' # the path for the logs relative to ./src
  logsize: '100M' # max log file size for rotation
  maxlocations: 1000 # max number of jobs/shipments locations
  maxvehicles: 200 # max number of vehicles
  override: ['c', 'g', 'l', 't', 'x'] # allow cli options override (c, g, l, t, and x)
  path: '/usr/local/bin/' # VROOM binary location
  port: 3000 # expressjs port
  router: 'ors' # routing backend (osrm, libosrm, ors, or valhalla)
  timeout: 300000 # milli-seconds
  baseurl: '/' # base url for api
routingServers:
  ors:
    # Requests are proxied through the local `ors-proxy` service which
    # adds the Authorization header (OPENROUTESERVICE_API_KEY) before
    # forwarding to the public OpenRouteService API.
    # Keys are ORS profile names and must match the `profile` sent in
    # each vehicle (VROOM v1.15 uses the profile name in the URL path).
    # The `/v2` slug is part of the host path (`ors-proxy/v2`) and the
    # proxy forwards the path as-is (see docker/ors-proxy/server.js).
    driving-car:
      host: 'ors-proxy/v2'
      port: '8090'
    driving-hgv:
      host: 'ors-proxy/v2'
      port: '8090'
    cycling-regular:
      host: 'ors-proxy/v2'
      port: '8090'
    cycling-mountain:
      host: 'ors-proxy/v2'
      port: '8090'
    cycling-road:
      host: 'ors-proxy/v2'
      port: '8090'
    cycling-electric:
      host: 'ors-proxy/v2'
      port: '8090'
    foot-walking:
      host: 'ors-proxy/v2'
      port: '8090'
    foot-hiking:
      host: 'ors-proxy/v2'
      port: '8090'