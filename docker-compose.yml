services:
  postgres:
    image: postgres:16
    container_name: caspex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caspex_db}
      POSTGRES_USER: ${POSTGRES_USER:-caspex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - caspex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-caspex_user} -d ${POSTGRES_DB:-caspex_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caspex-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Docker-network hosts override the localhost values from .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-caspex_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-caspex_db}
      MQTT_URL: mqtt://mosquitto:1883
      VROOM_URL: http://vroom-express:3000
    ports:
      - "3000:3000"
    volumes:
      - caspex_uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: caspex-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - caspex_mosquitto_data:/mosquitto/data
      - caspex_mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ors-proxy:
    build:
      context: .
      dockerfile: docker/ors-proxy/Dockerfile
    container_name: caspex-ors-proxy
    restart: unless-stopped
    environment:
      PORT: "8090"
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      ORS_BASE_URL: ${OPENROUTESERVICE_BASE_URL:-https://api.openrouteservice.org}

  vroom-express:
    build:
      context: .
      dockerfile: docker/vroom-express/Dockerfile
    container_name: caspex-vroom-express
    restart: unless-stopped
    depends_on:
      - ors-proxy
    environment:
      VROOM_ROUTER: ${VROOM_ROUTER:-ors}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      PORT: "3000"
    ports:
      - "3003:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:3000/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ../caspxx-front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: caspex-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  caspex_postgres_data:
  caspex_uploads_data:
  caspex_mosquitto_data:
  caspex_mosquitto_log:
